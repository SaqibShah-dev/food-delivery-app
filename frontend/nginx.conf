server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Container health endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprinted assets can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent browsers from holding onto an outdated app entry point.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}