server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Container HTTP health endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite generates fingerprinted assets.
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Avoid caching the application entry point across releases.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router fallback:
    # /orders, /cart, /admin/orders, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}